  "components": {
    "schemas": {
      "MeasurementRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "eventId",
          "capteurId",
          "date",
          "temperature"
        ],
        "properties": {
          "eventId": {
            "type": "string",
            "format": "uuid"
          },
          "capteurId": {
            "type": "string",
            "pattern": "^[A-Z0-9_-]{1,64}$"
          },
          "date": {
            "type": "string",
            "format": "date-time"
          },
          "temperature": {
            "type": "number",
            "minimum": -50,
            "maximum": 100
          }
        }
      },
      "SensorRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "libelle",
          "salle"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[A-Z0-9_-]{1,64}$"
          },
          "libelle": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "salle": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "seuilTemperature": {
            "type": "number",
            "minimum": -50,
            "maximum": 100
          },
          "actif": {
            "type": "boolean",
            "default": true
          }
        }
      },
      "SensorPatch": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version"
        ],
        "minProperties": 2,
        "properties": {
          "libelle": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "salle": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "seuilTemperature": {
            "type": "number",
            "minimum": -50,
            "maximum": 100
          },
          "actif": {
            "type": "boolean",
            "default": true
          },
          "version": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Problem": {
        "type": "object",
        "required": [
          "status",
          "detail",
          "code"
        ],
        "properties": {
          "type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer"
          },
          "detail": {
            "type": "string"
          },
          "instance": {
            "type": "string"
          },
          "code": {
            "type": "string"
          }
        }
      },
      "Measurement": {
        "type": "object",
        "properties": {
          "eventId": {
            "type": "string",
            "format": "uuid"
          },
          "capteurId": {
            "type": "string",
            "pattern": "^[A-Z0-9_-]{1,64}$"
          },
          "date": {
            "type": "string",
            "format": "date-time"
          },
          "temperature": {
            "type": "number",
            "minimum": -50,
            "maximum": 100
          }
        }
      },
      "Sensor": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[A-Z0-9_-]{1,64}$"
          },
          "libelle": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "salle": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120
          },
          "seuilTemperature": {
            "type": "number",
            "minimum": -50,
            "maximum": 100
          },
          "actif": {
            "type": "boolean",
            "default": true
          },
          "version": {
            "type": "integer"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Receipt": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "publicationState": {
            "enum": [
              "PENDING",
              "PUBLISHED"
            ]
          },
          "processingState": {
            "enum": [
              "PENDING",
              "PROCESSED",
